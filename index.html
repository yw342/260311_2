<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>중고 왼손 기타 매물</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #111111;
      --text-secondary: #6b6b6b;
      --border: #e0e0e0;
      --focus: #111111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    .layout {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }
    header {
      padding: 48px 0 32px;
      border-bottom: 1px solid var(--border);
    }
    header .layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 24px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .actions { display: flex; gap: 12px; align-items: center; }
    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      border-radius: 0;
      transition: border-color .15s, background .15s;
    }
    button:hover {
      border-color: var(--text);
      background: var(--bg);
    }
    button.primary {
      background: var(--text);
      color: var(--surface);
      border-color: var(--text);
    }
    button.primary:hover {
      background: #333;
      border-color: #333;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    main { padding: 48px 0 64px; }
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--border);
    }
    .card {
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card a {
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 24px;
      transition: background .12s;
    }
    .card a:hover { background: var(--bg); }
    .thumb {
      aspect-ratio: 4/3;
      background: var(--bg);
      object-fit: cover;
      width: 100%;
      margin: -24px -24px 0;
      width: calc(100% + 48px);
      max-width: none;
    }
    .no-img {
      aspect-ratio: 4/3;
      background: var(--bg);
      margin: -24px -24px 0;
      width: calc(100% + 48px);
      max-width: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .body { flex: 1; }
    .card h2 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }
    .price {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }
    .meta {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .meta span { margin-right: 0; }
    .meta span + span::before { content: " · "; margin: 0 .25em; }
    .loading, .empty, .error {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .error { color: var(--text); }
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="layout">
      <h1>왼손 기타 매물</h1>
      <div class="actions">
        <button type="button" id="btnRefresh">새로고침</button>
        <button type="button" class="primary" id="btnCrawl">크롤링 실행</button>
        <button type="button" id="btnAdd">매물 수동 추가</button>
      </div>
    </div>
  </header>
  <main>
    <div class="layout">
      <div id="addForm" style="display:none; margin-bottom:24px; padding:20px; background:var(--surface); border:1px solid var(--border);">
        <div style="font-weight:500; margin-bottom:12px;">매물 수동 추가 (크롤이 안 될 때)</div>
        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
          <input type="url" id="addUrl" placeholder="매물 URL (뮬 등)" style="flex:1; min-width:200px; padding:8px 12px; border:1px solid var(--border); font:inherit;" />
          <input type="text" id="addTitle" placeholder="제목" style="flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--border); font:inherit;" />
          <button type="button" id="btnAddSubmit">추가</button>
          <button type="button" id="btnAddCancel">취소</button>
        </div>
      </div>
      <div id="state" class="loading">불러오는 중…</div>
      <div id="list" class="list" style="display:none;"></div>
    </div>
  </main>
  <footer>
    <div class="layout">뮬(mule) 등 수집 · 거래 시 원문 확인 필요 · <span id="buildHint">페이지 v2</span></div>
  </footer>
  <script>
    const listEl = document.getElementById('list');
    const stateEl = document.getElementById('state');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnCrawl = document.getElementById('btnCrawl');
    const btnAdd = document.getElementById('btnAdd');
    const addForm = document.getElementById('addForm');
    const addUrl = document.getElementById('addUrl');
    const addTitle = document.getElementById('addTitle');
    const btnAddSubmit = document.getElementById('btnAddSubmit');
    const btnAddCancel = document.getElementById('btnAddCancel');

    const API = window.location.origin;
    let lastCrawlDebug = null;

    function setState(html, isError) {
      stateEl.innerHTML = html;
      stateEl.className = isError ? 'error' : 'loading';
      stateEl.style.display = 'block';
      listEl.style.display = 'none';
    }

    function render(list) {
      if (!list || list.length === 0) {
        let msg = '등록된 매물이 없습니다. "크롤링 실행"을 눌러 수집해 보세요.';
        if (lastCrawlDebug) {
          msg += '<div class="debug-box" style="margin-top:16px;padding:12px;background:#f0f0f0;font-size:12px;white-space:pre-wrap;text-align:left;">[마지막 크롤 디버그] 수신 길이: ' + (lastCrawlDebug.htmlLength || 0) + '자' +
            (lastCrawlDebug.triedProxies ? '\n시도한 프록시: ' + escapeHtml(lastCrawlDebug.triedProxies) : '') +
            (lastCrawlDebug.fetchError ? '\n연결 오류: ' + escapeHtml(lastCrawlDebug.fetchError) : '') +
            (lastCrawlDebug.snippet && lastCrawlDebug.snippet !== '(없음)' ? '\n처음 200자: ' + escapeHtml(lastCrawlDebug.snippet) : '') + '</div>';
          msg += '<p style="margin-top:12px;">크롤이 되지 않으면 <strong>매물 수동 추가</strong>로 URL과 제목을 입력해 보세요.</p>';
        }
        setState(msg);
        return;
      }
      stateEl.style.display = 'none';
      listEl.style.display = 'grid';
      listEl.innerHTML = list.map((item) => {
        const date = item.posted_at ? new Date(item.posted_at).toLocaleDateString('ko-KR') : '-';
        const img = item.image_url
          ? `<img class="thumb" src="${escapeAttr(item.image_url)}" alt="" loading="lazy" />`
          : '<div class="no-img">이미지 없음</div>';
        return `
          <article class="card">
            <a href="${escapeAttr(item.source_url)}" target="_blank" rel="noopener">
              ${img}
              <div class="body">
                <h2>${escapeHtml(item.title)}</h2>
                ${item.price ? `<div class="price">${escapeHtml(item.price)}</div>` : ''}
                <div class="meta">
                  <span>${escapeHtml(item.source_site)}</span>
                  <span>${date}</span>
                </div>
              </div>
            </a>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }

    async function load() {
      setState('불러오는 중…');
      try {
        const r = await fetch(API + '/api/listings');
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const data = await r.json();
        render(data);
      } catch (e) {
        setState('목록을 불러오지 못했습니다. ' + e.message, true);
      }
    }

    btnRefresh.addEventListener('click', load);
    btnAdd.addEventListener('click', () => {
      addForm.style.display = 'block';
      addUrl.value = '';
      addTitle.value = '';
      addUrl.focus();
    });
    btnAddCancel.addEventListener('click', () => { addForm.style.display = 'none'; });
    btnAddSubmit.addEventListener('click', async () => {
      const url = addUrl.value.trim();
      const title = addTitle.value.trim();
      if (!url || !title) {
        alert('URL과 제목을 모두 입력해 주세요.');
        return;
      }
      btnAddSubmit.disabled = true;
      try {
        const r = await fetch(API + '/api/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_url: url, title }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          alert('추가 실패: ' + (data.error || r.status));
          return;
        }
        alert(data.message || '추가되었습니다.');
        addForm.style.display = 'none';
        await load();
      } catch (e) {
        alert('연결 실패: ' + (e.message || ''));
      } finally {
        btnAddSubmit.disabled = false;
      }
    });
    btnCrawl.addEventListener('click', async () => {
      btnCrawl.disabled = true;
      btnCrawl.textContent = '수집 중…';
      try {
        const r = await fetch(API + '/api/crawl?t=' + Date.now(), { method: 'POST', cache: 'no-store' });
        let data = {};
        const ct = r.headers.get('Content-Type') || '';
        if (ct.includes('application/json')) {
          data = await r.json().catch(() => ({}));
        } else if (!r.ok) {
          data = { error: '서버 오류 (' + r.status + '). 응답이 JSON이 아닙니다.' };
        }
        if (!r.ok) {
          const msg = data.error || r.statusText || ('HTTP ' + r.status);
          alert('오류: ' + msg);
          return;
        }
        lastCrawlDebug = data.debug || null;
        let msg = data.message || '크롤링 완료';
        if (data.debug) {
          msg += '\n\n[디버그] 수신 길이: ' + (data.debug.htmlLength || 0) + '자';
          if (data.debug.fetchError) msg += '\n연결 오류: ' + data.debug.fetchError;
          if (data.debug.snippet && data.debug.snippet !== '(없음)') msg += '\n처음 200자: ' + data.debug.snippet;
        }
        alert(msg);
        await load();
      } catch (e) {
        alert('연결 실패: ' + (e.message || '알 수 없음') + '\n\n인터넷·Vercel 배포 URL을 확인하세요. 같은 사이트에서 /api/ping 을 열어 {"ok":true} 가 나오는지 확인해 보세요.');
      } finally {
        btnCrawl.disabled = false;
        btnCrawl.textContent = '크롤링 실행';
      }
    });

    load();
  </script>
</body>
</html>
