<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>중고 왼손 기타 매물</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a1f;
      --text: #e8e6e3;
      --muted: #888;
      --accent: #c9a227;
      --link: #7eb8da;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      padding: 1.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 600; color: var(--accent); }
    .actions { display: flex; gap: .75rem; align-items: center; }
    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      padding: .5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }
    button:hover { background: #252530; }
    button.primary { background: var(--accent); color: #0f0f12; border-color: var(--accent); }
    button.primary:hover { filter: brightness(1.1); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2rem;
    }
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      flex-direction: column;
    }
    .card a { color: inherit; text-decoration: none; display: flex; flex-direction: column; flex: 1; }
    .card a:hover { color: var(--link); }
    .thumb {
      aspect-ratio: 4/3;
      background: #252530;
      object-fit: cover;
      width: 100%;
    }
    .no-img {
      aspect-ratio: 4/3;
      background: #252530;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: .85rem;
    }
    .body { padding: 1rem; flex: 1; }
    .card h2 { margin: 0 0 .5rem; font-size: 1rem; font-weight: 600; line-height: 1.35; }
    .price { color: var(--accent); font-weight: 600; margin-bottom: .35rem; }
    .meta { font-size: .8rem; color: var(--muted); }
    .meta span { margin-right: .5rem; }
    .loading, .empty, .error {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .error { color: #e07070; }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: .85rem;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,.06);
    }
  </style>
</head>
<body>
  <header>
    <h1>🎸 중고 왼손 기타 매물</h1>
    <div class="actions">
      <button type="button" id="btnRefresh">새로고침</button>
      <button type="button" class="primary" id="btnCrawl">크롤링 실행</button>
    </div>
  </header>
  <main>
    <div id="state" class="loading">불러오는 중…</div>
    <div id="list" class="list" style="display:none;"></div>
  </main>
  <footer>
    출처: 뮬(mule) 등 | 데이터는 수집 시점 기준이며, 거래 시 원문을 확인하세요.
  </footer>
  <script>
    const listEl = document.getElementById('list');
    const stateEl = document.getElementById('state');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnCrawl = document.getElementById('btnCrawl');

    const API = window.location.origin;

    function setState(html, isError) {
      stateEl.innerHTML = html;
      stateEl.className = isError ? 'error' : 'loading';
      stateEl.style.display = 'block';
      listEl.style.display = 'none';
    }

    function render(list) {
      if (!list || list.length === 0) {
        setState('등록된 매물이 없습니다. "크롤링 실행"을 눌러 수집해 보세요.');
        return;
      }
      stateEl.style.display = 'none';
      listEl.style.display = 'grid';
      listEl.innerHTML = list.map((item) => {
        const date = item.posted_at ? new Date(item.posted_at).toLocaleDateString('ko-KR') : '-';
        const img = item.image_url
          ? `<img class="thumb" src="${escapeAttr(item.image_url)}" alt="" loading="lazy" />`
          : '<div class="no-img">이미지 없음</div>';
        return `
          <article class="card">
            <a href="${escapeAttr(item.source_url)}" target="_blank" rel="noopener">
              ${img}
              <div class="body">
                <h2>${escapeHtml(item.title)}</h2>
                ${item.price ? `<div class="price">${escapeHtml(item.price)}</div>` : ''}
                <div class="meta">
                  <span>${escapeHtml(item.source_site)}</span>
                  <span>${date}</span>
                </div>
              </div>
            </a>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g, '&quot;');
    }

    async function load() {
      setState('불러오는 중…');
      try {
        const r = await fetch(API + '/api/listings');
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const data = await r.json();
        render(data);
      } catch (e) {
        setState('목록을 불러오지 못했습니다. ' + e.message, true);
      }
    }

    btnRefresh.addEventListener('click', load);
    btnCrawl.addEventListener('click', async () => {
      btnCrawl.disabled = true;
      btnCrawl.textContent = '수집 중…';
      try {
        const r = await fetch(API + '/api/crawl', { method: 'POST' });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || r.statusText);
        alert(data.message || '크롤링 완료');
        await load();
      } catch (e) {
        alert('크롤링 실패: ' + e.message);
      }
      btnCrawl.disabled = false;
      btnCrawl.textContent = '크롤링 실행';
    });

    load();
  </script>
</body>
</html>
